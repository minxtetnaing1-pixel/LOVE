<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Special Surprise ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1b1026, #5b1748, #ff5c8a);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
}

.box {
    width: 90%;
    max-width: 450px;
    padding: 35px 25px;
    border-radius: 25px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    z-index: 2;
}

h1 {
    font-size: 32px;
}

p {
    font-size: 19px;
    line-height: 1.6;
}

button {
    margin-top: 15px;
    padding: 16px 28px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}

.heart {
    position: absolute;
    top: -50px;
    font-size: 25px;
    animation: fall 6s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}

#countdown {
    font-size: 80px;
}

#final {
    display: none;
}

.message {
    animation: appear 1s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="box">

<div id="start">
    <h1>Hey... 👀</h1>
    <p>I have something special for you...</p>
    <p>But are you ready? 🤫</p>

    <button onclick="startSurprise()">I'm Ready 🎁</button>
</div>

<div id="countdownBox" style="display:none;">
    <div id="countdown">3</div>
    <p>Get ready... ❤️</p>
</div>

<div id="final">
    <div class="message">
        <h1>🎉 SURPRISE! 🎉</h1>

        <p>❤️ You are someone very special to me.</p>

        <p>Thank you for coming into my life. 🥰</p>

        <p>You make my days happier and my life more beautiful. 🌹</p>

        <h2>❤️ I Love You ❤️</h2>

        <p>Forever and always... 💕</p>
    </div>
</div>

</div>

<script>

function startSurprise() {

    document.getElementById("start").style.display = "none";
    document.getElementById("countdownBox").style.display = "block";

    let count = 3;

    const timer = setInterval(function() {

        document.getElementById("countdown").innerHTML = count;

        count--;

        if (count < 0) {

            clearInterval(timer);

            document.getElementById("countdownBox").style.display = "none";
            document.getElementById("final").style.display = "block";

            startHearts();
        }

    }, 1000);
}

function startHearts() {

    setInterval(function() {

        const heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML = "❤️";

        heart.style.left = Math.random() * 100 + "vw";

        document.body.appendChild(heart);

        setTimeout(function() {
            heart.remove();
        }, 6000);

    }, 400);
}

</script>

</body>
</html>
